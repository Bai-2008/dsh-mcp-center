      description: 可选 API Key，用于提高请求配额。
      obtain_at: https://context7.com/dashboard
      required: false
      secret: true
tools: []
categories:
  - 开发工具
tags:
  - 文档
  - 代码检索
  - 开发
official: true
verified: false
clients:
  - dsh
  - claude-desktop
  - cursor
  - cline
license: MIT
last_checked: 2026-10-30
