"$schema": "../../schema/registry.schema.json"
name: io.github.upstash/context7
display_name: Context7
description: 为模型提供最新、版本感知的官方代码文档、API 参考与示例。
description_en: Up-to-date, version-specific documentation and code examples for AI agents.
version: 4.4.4
homepage: https://context7.com
