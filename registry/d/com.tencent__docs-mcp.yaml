      description: 腾讯文档个人 Token（直接填写 Token，不要加 Bearer 前缀）
      obtain_at: https://docs.qq.com/open/auth/mcp.html
      required: true
      secret: true
categories:
  - 办公
tags:
  - 文档
  - 表格
  - 幻灯片
  - 协作
official: true
license: Proprietary
tools: []
clients:
  - dsh
  - claude-desktop
  - cursor
  - cline
