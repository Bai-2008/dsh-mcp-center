description_en: Official Tencent Docs MCP for documents, sheets, slides, mind
  maps and smart tables.
version: 1.0.0
homepage: https://docs.qq.com/open/document/saas/mcp.html
vendor: 腾讯文档
transport:
  type: streamable_http
  url: https://docs.qq.com/openapi/mcp
