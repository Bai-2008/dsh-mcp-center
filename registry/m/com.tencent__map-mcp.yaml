$schema: ../../schema/registry.schema.json
name: com.tencent/map-mcp
display_name: 腾讯地图
description: 腾讯位置服务官方 MCP，提供地址解析、POI 搜索、路线规划、天气和行政区划查询。
description_en: Official Tencent Location Service MCP for geocoding, POI, routing and weather.
version: 1.0.0
homepage: https://lbs.qq.com/
vendor: 腾讯位置服务
