$schema: ../../schema/registry.schema.json
name: com.baidu/map-mcp
display_name: 百度地图
description: 百度地图官方 MCP，提供地理编码、POI 搜索、路径规划、天气、IP 定位和路况查询。
description_en: Official Baidu Maps MCP for geocoding, POI search, routing,
  weather and traffic.
version: 1.0.5
homepage: https://lbsyun.baidu.com/
repository: https://github.com/baidu-maps/mcp
vendor: 百度地图
transport:
  type: stdio
  command: npx
  args:
    - -y
    - "@baidumap/mcp-server-baidu-map"
  env:
    - name: BAIDU_MAP_API_KEY
      description: 百度地图开放平台服务端 AK，需开启 MCP(SSE) 服务
      obtain_at: https://lbsyun.baidu.com/apiconsole/key
      required: true
      secret: true
categories:
  - 出行
tags:
  - 地图
  - POI
  - 路线规划
  - 天气
official: true
license: MIT
tools: []
clients:
  - dsh
  - claude-desktop
  - cursor
  - cline
last_checked: 2026-10-31
verified: false
